<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carousel</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            padding: 0;
            background: white;
        }

        .carousel {
            width: 100%;
        }

        .carousel-item img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

    <div id="carouselExampleIndicators" class="carousel slide">

        <!-- INDICADORES -->
        <div class="carousel-indicators">

            <button 
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1">
            </button>

            <button 
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="1"
                aria-label="Slide 2">
            </button>

            <button 
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="2"
                aria-label="Slide 3">
            </button>

            <button 
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="3"
                aria-label="Slide 4">
            </button>

            <button 
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="4"
                aria-label="Slide 5">
            </button>

            <button 
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="5"
                aria-label="Slide 6">
            </button>

        </div>


        <!-- IMÁGENES -->
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img 
                    src="https://picsum.photos/id/1015/1600/900"
                    alt="Imagen 1"
                >
            </div>

            <div class="carousel-item">
                <img 
                    src="https://picsum.photos/id/1016/1600/900"
                    alt="Imagen 2"
                >
            </div>

            <div class="carousel-item">
                <img 
                    src="https://picsum.photos/id/1018/1600/900"
                    alt="Imagen 3"
                >
            </div>

            <div class="carousel-item">
                <img 
                    src="https://picsum.photos/id/1020/1600/900"
                    alt="Imagen 4"
                >
            </div>

            <div class="carousel-item">
                <img 
                    src="https://picsum.photos/id/1024/1600/900"
                    alt="Imagen 5"
                >
            </div>

            <div class="carousel-item">
                <img 
                    src="https://picsum.photos/id/1025/1600/900"
                    alt="Imagen 6"
                >
            </div>

        </div>


        <!-- FLECHA ANTERIOR -->
        <button 
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev"
        >
            <span 
                class="carousel-control-prev-icon"
                aria-hidden="true">
            </span>

            <span class="visually-hidden">
                Anterior
            </span>
        </button>


        <!-- FLECHA SIGUIENTE -->
        <button 
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next"
        >
            <span 
                class="carousel-control-next-icon"
                aria-hidden="true">
            </span>

            <span class="visually-hidden">
                Siguiente
            </span>
        </button>

    </div>


    <!-- Bootstrap JS -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
